<style>
:root{
  --primary:#224239; --auxiliary:#BA9356; --bg-mint:#D4FFE0; --bg:#FFFFFF;
  --type:#232323; --muted:#737373; --card:#FAFAFA; --border:#E0E0E0;
  --destructive:#EF4444; --accent:#BA9356; --wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--type);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hidden{display:none !important}
.wrap{min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px}
.fade-in{animation:fadeIn .55s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes buttonPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes buttonPulseWA{0%,100%{box-shadow:0 0 35px rgba(37,211,102,.6),0 4px 20px rgba(0,0,0,.2)}50%{box-shadow:0 0 55px rgba(37,211,102,.85),0 4px 20px rgba(0,0,0,.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* Welcome */
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(34,66,57,.08);border:1px solid rgba(34,66,57,.19);margin-bottom:20px}
.badge span{font-size:13px;font-weight:600;color:var(--primary)}
.badge img{width:20px;height:16px;object-fit:contain}
h1.hero{text-align:center;margin-bottom:20px;max-width:340px;line-height:1.15}
h1.hero .l1{display:block;font-weight:700;font-size:1.5rem;color:var(--primary);letter-spacing:-.02em}
h1.hero .l2{display:block;margin-top:2px}
h1.hero .gold{font-weight:700;font-size:1.7rem;color:var(--auxiliary)}
h1.hero .l2 .rest{font-weight:700;font-size:1.5rem;color:var(--primary)}
h1.hero .l3{display:block;font-weight:700;font-size:1.5rem;color:var(--primary);margin-top:2px}
h1.hero .headline-full{font-size:1.7rem;line-height:1.14;letter-spacing:-.025em}
@media(min-width:640px){
  h1.hero{max-width:900px;margin-bottom:32px}
  h1.hero .l1,h1.hero .l2 .rest,h1.hero .l3{font-size:2.25rem}
  h1.hero .headline-full{font-size:2.6rem}
  h1.hero .gold{font-size:2.75rem}
}
.sub1{font-size:16px;font-weight:500;color:rgba(35,35,35,.78);margin-bottom:6px;text-align:center;max-width:440px}
.sub2{font-size:13px;color:rgba(35,35,35,.5);margin-bottom:24px;text-align:center;max-width:440px}
.benefits{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin:0 auto 24px}
.benefit{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:12px;background:rgba(212,255,224,.25);border:1px solid var(--bg-mint)}
.benefit span{font-size:14px;font-weight:500;color:rgba(35,35,35,.62);white-space:nowrap}
@media(min-width:920px){
  .benefits{flex-direction:row;flex-wrap:nowrap;justify-content:center;align-items:center;gap:0;width:auto;max-width:none;margin:0 auto 24px;padding:13px 24px;border-radius:16px;background:rgba(212,255,224,.2);border:1px solid var(--bg-mint)}
  .benefit{background:none;border:none;padding:0}
  .benefit span{font-size:13px}
  .benefit + .benefit{margin-left:16px;padding-left:16px;border-left:1px solid var(--bg-mint)}
}
.btn-gold{width:100%;max-width:340px;padding:15px 24px;font-weight:700;font-size:17px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#BA9356 0%,#d4ab6a 50%,#BA9356 100%);box-shadow:0 0 25px rgba(186,147,86,.31),0 4px 20px rgba(0,0,0,.15);border:1px solid rgba(186,147,86,.38);animation:buttonPulse 2s ease-in-out infinite;transition:all .3s}
.btn-gold:hover{background:var(--bg-mint);color:var(--primary);animation:none;box-shadow:0 0 20px rgba(212,255,224,.5),0 4px 15px rgba(0,0,0,.1)}
.btn-gold:disabled{opacity:.7}
.legal{margin-top:20px;font-size:11px;color:rgba(35,35,35,.38);max-width:340px;text-align:center}
.logo-foot{margin-top:22px;height:28px;width:auto;opacity:.6}

/* Progress header */
#qHeader{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:16px 16px 8px}
.hdr-inner{max-width:576px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pbar-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pbar{height:6px;width:100%;border-radius:999px;background:#EDEDED;overflow:hidden}
.pbar > div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),#2d7a62);transition:width .4s ease}
.back-btn{display:flex;align-items:center;gap:4px;color:var(--auxiliary);font-size:14px;font-weight:500}
.back-btn[disabled]{opacity:0;pointer-events:none}

/* Question */
.q-wrap{width:100%;max-width:576px;margin:0 auto;padding-top:calc(var(--qh,96px) + 24px);padding-bottom:40px}
.q-title{font-size:1.4rem;font-weight:700;color:var(--primary);margin-bottom:8px;text-align:center;line-height:1.25}
.q-desc{font-size:14px;color:var(--muted);margin-bottom:24px;text-align:center}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);transition:all .2s}
.opt:hover{border-color:var(--auxiliary);box-shadow:0 2px 16px rgba(34,66,57,.08);transform:translateY(-1px)}
.opt.sel{border-color:var(--auxiliary);background:rgba(186,147,86,.08)}
.opt-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.15);color:var(--auxiliary);flex-shrink:0}
.opt span{font-size:15px;font-weight:500;color:var(--type);line-height:1.35}
.streak{text-align:center;margin-top:20px;font-size:12px;color:var(--auxiliary);font-weight:600}
.q-anim-out{opacity:0;transform:scale(.97);filter:blur(6px);transition:all .45s ease-out}

/* Transition */
.trans{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.trans h2{font-size:1.35rem;font-weight:700;color:var(--primary)}
.trans p{font-size:14px;color:var(--muted)}

/* Form */
.form-wrap{width:100%;max-width:420px;margin:0 auto;padding:32px 0}
.form-wrap h2{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:10px;color:var(--primary)}
.form-wrap .lead{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px}
form{display:flex;flex-direction:column;gap:18px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;text-align:left}
.field{position:relative}
.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field .ok{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--auxiliary)}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:15px 44px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:16px;color:var(--type);outline:none;transition:all .2s}
input:focus{border-color:var(--auxiliary);box-shadow:0 0 0 3px rgba(186,147,86,.2)}
input.err{border-color:var(--destructive)}
.err-msg{margin-top:8px;font-size:12px;color:var(--destructive);text-align:left}
.hint{margin-top:10px;font-size:12px;color:rgba(115,115,115,.85);text-align:left}
.phone-row{display:flex;gap:10px}
.cbtn{display:flex;align-items:center;gap:8px;padding:15px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);min-width:112px}
.cbtn .fl{font-size:19px}
.cbtn .dd{font-size:14px;font-weight:500}
.cdrop{position:absolute;top:100%;left:0;margin-top:8px;width:280px;border-radius:12px;background:#fff;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.14);z-index:60;overflow:hidden}
.cdrop .srch{padding:12px;border-bottom:1px solid var(--border)}
.cdrop .srch input{width:100%;padding:10px 12px;border-radius:8px;background:#F2F4F3;border:none;font-size:14px;outline:none}
.clist{max-height:230px;overflow-y:auto}
.citem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;transition:background .15s}
.citem:hover{background:#F2F4F3}
.citem .nm{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .dd{font-size:14px;color:var(--muted);font-weight:500}
.btn-submit{width:100%;padding:16px;border-radius:12px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#BA9356 0%,#d4ab6a 50%,#BA9356 100%);box-shadow:0 0 25px rgba(186,147,86,.3);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .3s}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

/* Result */
.res{width:100%;max-width:576px;margin:0 auto;padding:32px 16px 128px}
.phase{opacity:0;transform:translateY(16px);transition:opacity .7s ease-out,transform .7s ease-out}
.phase.on{opacity:1;transform:none}
.arch{display:inline-flex;flex-direction:column;align-items:center;gap:12px;padding:16px 24px;border-radius:16px;border:1px solid rgba(34,66,57,.3);
  background:linear-gradient(135deg,rgba(34,66,57,.1),var(--card),rgba(186,147,86,.06));box-shadow:0 0 30px rgba(34,66,57,.08),0 4px 20px rgba(0,0,0,.06)}
.arch .lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.arch h2{font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,#C9A45C,#E0B96F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.arch p{font-size:12px;color:var(--muted);max-width:260px;text-align:center;line-height:1.5}
.res h1{font-size:1.75rem;font-weight:700;margin-bottom:14px;line-height:1.2;color:var(--primary)}
.res .pitch{font-size:1.1rem;line-height:1.5;margin-bottom:14px}
.res .pitch b{color:var(--auxiliary);white-space:nowrap}
.spec{margin-top:22px;padding:16px;border-radius:12px;background:rgba(186,147,86,.08);border:1px solid rgba(186,147,86,.25);display:flex;align-items:center;gap:12px;text-align:left}
.spec .cir{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.15);color:var(--auxiliary);flex-shrink:0}
.card{padding:24px;border-radius:16px;border:1px solid var(--border);background:var(--card)}
.card.big{border:2px solid rgba(34,66,57,.3);background:linear-gradient(135deg,rgba(34,66,57,.07),var(--card),rgba(186,147,86,.04));box-shadow:0 0 40px rgba(34,66,57,.09),0 8px 32px rgba(0,0,0,.06)}
.card h3{font-size:1.05rem;font-weight:700}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--primary)}
.clist2{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.clist2 li{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5}
.clist2 svg{color:var(--primary);flex-shrink:0;margin-top:2px}
.income{padding:16px;border-radius:12px;text-align:center;background:rgba(186,147,86,.1);border:1px solid rgba(186,147,86,.2)}
.income .t{font-size:12px;color:var(--muted);margin-bottom:4px}
.income .v{font-size:1.75rem;font-weight:700;color:var(--auxiliary)}
.income .s{font-size:12px;color:var(--muted);margin-top:4px}
.vid{position:relative;width:100%;padding-bottom:56.25%;border-radius:12px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mb8{margin-bottom:32px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;padding:6px 12px;border-radius:999px;background:rgba(186,147,86,.1);border:1px solid rgba(186,147,86,.2);font-size:12px;font-weight:700;color:var(--auxiliary)}
.foot-logo{display:block;height:22px;width:auto;opacity:.4;margin:8px auto 16px}
#ctaBar{position:fixed;bottom:0;left:0;right:0;z-index:50}
#ctaBar .grad{position:absolute;inset:auto 0 0 0;height:140px;pointer-events:none;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.95) 40%,rgba(255,255,255,.7) 70%,transparent 100%)}
#ctaBar .inner{position:relative;padding:40px 16px 24px;max-width:576px;margin:0 auto}
.btn-wa{width:100%;padding:16px 24px;border-radius:12px;font-weight:700;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#25D366 0%,#128C7E 100%);border:1px solid rgba(37,211,102,.5);animation:buttonPulseWA 2s ease-in-out infinite;transition:all .3s}
.btn-wa:disabled{opacity:.8;cursor:wait;animation:none}
.wa-err{margin-top:12px;text-align:center;font-size:14px;color:var(--destructive);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Interactive folds ===== */
.fold-wrap{width:100%;max-width:560px;margin:0 auto;padding:calc(var(--qh,96px) + 20px) 0 40px}
.sec-eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--auxiliary);margin-bottom:6px}
.sec-title{font-size:1.55rem;font-weight:800;color:var(--primary);letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.sec-def{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.fold-card{margin-bottom:20px}
.fold-h3{font-size:1.15rem;font-weight:800;color:var(--primary);margin-bottom:18px;letter-spacing:-.01em}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease-out,transform .5s ease-out}
.reveal.on{opacity:1;transform:none}

/* 20/80 split bar */
.split{margin-bottom:22px}
.split-labels{display:flex;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.split-labels span:first-child{width:20%;min-width:74px}
.split-labels span:last-child{flex:1}
.split-bar{display:flex;gap:6px;height:16px}
.split-you{width:0;background:var(--primary);border-radius:999px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.split-loc{width:0;background:linear-gradient(90deg,#6FBF97,#8FD3AE);border-radius:999px;transition:width .9s cubic-bezier(.22,1,.36,1) .15s}
.split-pct{display:flex;margin-top:6px;font-size:15px;font-weight:800}
.split-pct .you{width:20%;min-width:74px;color:var(--primary)}
.split-pct .loc{flex:1;color:#4EA47A}

/* numbered steps */
.steps-list{display:flex;flex-direction:column;gap:14px}
.step-row{display:flex;align-items:flex-start;gap:14px}
.step-num{width:32px;height:32px;border-radius:50%;background:rgba(186,147,86,.15);color:var(--auxiliary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-h{font-size:15px;font-weight:700;color:var(--type);margin-bottom:2px;line-height:1.25}
.step-d{font-size:13px;color:var(--muted);line-height:1.45}

/* embedded question */
.qb{margin-top:24px;padding-top:22px;border-top:1px dashed var(--border)}
.qb-eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--auxiliary);margin-bottom:8px}
.qb-title{font-size:1.15rem;font-weight:700;color:var(--primary);margin-bottom:16px;line-height:1.3}

/* accordion */
.acc{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.acc-item{border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden;transition:border-color .2s}
.acc-item.open{border-color:var(--auxiliary)}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px;text-align:left}
.acc-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(34,66,57,.08);color:var(--primary);flex-shrink:0}
.acc-t{flex:1;font-size:15px;font-weight:700;color:var(--type)}
.acc-chev{color:var(--muted);transition:transform .3s}
.acc-item.open .acc-chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-item.open .acc-body{max-height:260px}
.acc-body ul{list-style:none;padding:0 16px 16px 64px;display:flex;flex-direction:column;gap:10px}
.acc-body li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.acc-body li svg{color:var(--auxiliary);flex-shrink:0}

/* plan card in fold */
.plan-card{margin-top:20px}

/* benefit cards */
.bcards{display:flex;flex-direction:column;gap:12px;margin:20px 0 4px}
.bcard{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.bc-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.14);color:var(--auxiliary);margin-bottom:10px}
.bc-h{font-size:15px;font-weight:700;color:var(--type);margin-bottom:4px}
.bc-d{font-size:13px;color:var(--muted);line-height:1.45}

/* depoimentos */
.depo{margin-top:14px;padding:16px;border-radius:12px;background:rgba(212,255,224,.2);border:1px solid var(--bg-mint)}
.depo .dq{font-size:15px;font-weight:600;color:var(--type);line-height:1.5;margin:8px 0 8px}
.depo .da{font-size:12px;color:var(--muted);font-weight:600}

/* Rentabilidade showcase (like landing) */
.rent-panel{background:var(--primary);border-radius:20px;padding:16px 14px;margin-bottom:20px}
.rent-card{border-radius:14px;padding:15px 13px;margin-bottom:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.rent-card:last-of-type{margin-bottom:0}
.rent-card.feat{background:#fff;border-color:transparent}
.rent-label{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);margin-bottom:7px}
.rent-card.feat .rent-label{color:rgba(35,35,35,.55)}
.rent-rate{opacity:.8}
.rent-val{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rent-total{font-size:1.45rem;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1}
.rent-card.feat .rent-total{color:var(--primary)}
.rent-growth{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:#7ED957}
.rent-chart{position:relative;display:flex;align-items:flex-end;gap:3px;height:150px;margin:16px 0 8px}
.rbar{flex:1;background:linear-gradient(180deg,#93E36F,#2f7d3f);border-radius:4px 4px 0 0;height:0;transition:height .7s cubic-bezier(.22,1,.36,1)}
.rent-card.feat .rbar{background:linear-gradient(180deg,#8FE06B,#39a04d)}
.rnote{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform:translateX(var(--tx,-50%));opacity:0;animation:noteIn .45s ease-out .6s forwards;color:#fff}
.rent-card.feat .rnote{color:#213c33}
.rnote-v{font-size:9.5px;font-weight:700;white-space:nowrap;margin-bottom:3px;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.rent-card.feat .rnote-v{text-shadow:none}
.rnote-dot{width:6px;height:6px;border-radius:50%;border:2px solid currentColor;background:transparent}
@keyframes noteIn{from{opacity:0}to{opacity:1}}
.rent-axis{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.5)}
.rent-card.feat .rent-axis{color:rgba(35,35,35,.4)}
.rent-disc{font-size:10px;font-style:italic;color:rgba(255,255,255,.55);line-height:1.45;margin-top:14px}

/* Ponta a ponta - all visible */
.ponta{display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
.ponta-card{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:16px}
.ponta-card.hl{border-color:var(--auxiliary)}
.ponta-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ponta-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(34,66,57,.08);color:var(--primary);flex-shrink:0}
.ponta-t{font-size:15px;font-weight:700;color:var(--type)}
.ponta-list{list-style:none;padding:0 0 0 48px;display:flex;flex-direction:column;gap:9px}
.ponta-list li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ponta-list li svg{color:var(--auxiliary);flex-shrink:0}

/* Personalized projection */
.tier-name{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;margin-bottom:16px}
.proj{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.proj-cell{flex:1;min-width:120px;padding:14px;border-radius:12px;background:#fff;border:1px solid var(--border);text-align:center;display:flex;flex-direction:column;justify-content:center}
.proj-cell.hero-cell{background:rgba(186,147,86,.1);border-color:rgba(186,147,86,.35)}
.proj-cell .pl{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.3}
.proj-cell .pv{font-size:1.15rem;font-weight:800;color:var(--primary);line-height:1.1}
.proj-cell .pv.gold{color:var(--auxiliary)}
.proj-cell .pv .mo{font-size:12px;font-weight:600;color:var(--muted)}
.proj-arrow{display:flex;align-items:center;justify-content:center;color:var(--auxiliary);flex-shrink:0}
@media(max-width:520px){.proj{flex-direction:column}.proj-arrow{transform:rotate(90deg);padding:2px 0}}
.proj-note{margin-top:14px;font-size:11px;color:rgba(115,115,115,.9);line-height:1.4;text-align:center}

/* Comparison bars */
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp-row{display:flex;align-items:center;gap:12px}
.cmp-lbl{font-size:13px;font-weight:600;color:var(--type);min-width:96px}
.cmp-track{flex:1;height:14px;border-radius:999px;background:#EDEDED;overflow:hidden}
.cmp-fill{height:100%;border-radius:999px;transform-origin:left;animation:cmpGrow 1s ease-out both}
.cmp-fill.low{background:#C9CFCB}
.cmp-fill.mid{background:#8FB0A3}
.cmp-fill.high{background:linear-gradient(90deg,var(--primary),#2d7a62)}
@keyframes cmpGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Ponta a ponta */
.p2p{display:flex;flex-direction:column;gap:14px}
.p2p-item{display:flex;align-items:flex-start;gap:12px}
.p2p-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.14);color:var(--auxiliary);flex-shrink:0}
.p2p-h{font-size:14px;font-weight:700;color:var(--type);margin-bottom:2px}
.p2p-d{font-size:13px;color:var(--muted);line-height:1.45}

/* Scale stats */
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;padding:18px 8px;border-radius:14px;background:linear-gradient(135deg,rgba(34,66,57,.07),var(--card));border:1px solid var(--border)}
.stat .sn{font-size:1.6rem;font-weight:800;color:var(--primary);line-height:1}
.stat .sl{font-size:12px;color:var(--muted);margin-top:6px}

/* Testimonial quote */
.quote{margin-top:16px;padding:16px;border-radius:12px;background:rgba(212,255,224,.2);border:1px solid var(--bg-mint)}
.quote .qt{font-size:15px;font-weight:600;color:var(--type);line-height:1.5;margin:8px 0 8px}
.quote .qa{font-size:12px;color:var(--muted);font-weight:600}
/* Escala fold visual (persona B) */
.esc-viz{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 14px 10px;margin-bottom:14px}
.esc-viz svg{width:100%;height:auto;display:block}
.esc-cards{display:flex;flex-direction:column;gap:10px}
.esc-card{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.esc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.12);color:var(--auxiliary);flex-shrink:0}
.esc-t{font-size:15px;font-weight:700;color:var(--type);margin-bottom:1px}
.esc-d{font-size:13px;color:var(--muted);line-height:1.4}
.esc-viz .eb{opacity:0;animation:escGrow .55s cubic-bezier(.22,1,.36,1) forwards}
@keyframes escGrow{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>

function sbInsert(table, row){
  return fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal'},
    body: JSON.stringify(row)
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return true; })
    .catch(function(e){ console.error('[Supabase] insert '+table+' failed:', e); return false; });
}
function sbFunction(name, body){
  return fetch(SUPABASE_URL + '/functions/v1/' + name, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().catch(function(){ return {}; }); })
    .catch(function(e){ console.error('[EdgeFn] '+name+' failed:', e); return null; });
}
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now()+'-'+Math.random().toString(36).slice(2);
}

/* ============ SCORING ============ */
function calcCapacidade(a){
  var m={ate_1k:0,'1k_3k':60,'3k_5k':85,acima_5k:100}[a.monthlyInvestment]||0;
  var i={ate_8k:20,'8k_15k':50,'15k_30k':80,acima_30k:100}[a.income]||0;
  return Math.round(m*0.80+i*0.20);
}
function calcTiming(a){ return {imediato:100,'3_meses':75,'3_6_meses':45,sem_pressa:15}[a.urgency]||0; }
function calcConsciencia(a){
  var mo={gasto_tudo:0,guardo_nao_rende:40,invisto_sem_estrategia:70,invisto_estrategico:100}[a.financialMoment]||0;
  var ob={planta_aluguel:100,planta_valorizacao:100,morar:65,entender:20}[a.objective]||0;
  return Math.round(mo*0.60+ob*0.40);
}
function calculateScores(a){
  return { capacidade:Math.min(100,calcCapacidade(a)), timing:Math.min(100,calcTiming(a)), consciencia:Math.min(100,calcConsciencia(a)) };
}
function calcLeadScore(s,a){
  var v = Math.round(s.capacidade*0.45 + s.timing*0.25 + s.consciencia*0.30);
  if (a.monthlyInvestment==='ate_1k') v = Math.min(v,50);
  if (a.financialMoment==='gasto_tudo' && a.objective==='entender') v = Math.min(v,35);
  if (a.objective==='entender' && a.urgency==='sem_pressa') v = Math.min(v,45);
  if (a.monthlyInvestment==='3k_5k' || a.monthlyInvestment==='acima_5k') v = Math.max(v,65);
  if (a.monthlyInvestment==='1k_3k' && (a.objective==='planta_aluguel'||a.objective==='planta_valorizacao')) v = Math.max(v,60);
  if (a.monthlyInvestment==='1k_3k' && a.urgency==='imediato') v = Math.max(v,60);
  if (a.objective==='morar' && (a.monthlyInvestment==='3k_5k'||a.monthlyInvestment==='acima_5k') && (a.urgency==='imediato'||a.urgency==='3_meses')) v = Math.max(v,65);
  if (a.financialMoment==='invisto_estrategico' && a.urgency==='imediato') v = Math.min(100, v+5);
  return Math.min(100, Math.max(0, v));
}
function determineProfile(s,a){
  var v = calcLeadScore(s,a);
  if (v>=75) return 'acelerador_patrimonial';
  if (v>=50) return 'investidor_estruturavel';
  return 'construtor_em_formacao';
}
function calculateQuizResult(a){
  var s = calculateScores(a);
  return { scores:s, profile:determineProfile(s,a), path:'CALL' };
}
function getLeadScore(a){ return calcLeadScore(calculateScores(a), a); }

function audioCtx(){
  try { var C = window.AudioContext || window.webkitAudioContext; var c = new C(); if (c.state==='suspended') c.resume(); return c; }
  catch(e){ return null; }
}
function playStartSound(){
  var ac = audioCtx(); if (!ac) return;
  var bufferSize = ac.sampleRate*0.3, buf = ac.createBuffer(1,bufferSize,ac.sampleRate), data = buf.getChannelData(0);
  for (var i=0;i<bufferSize;i++){ var t=i/ac.sampleRate; data[i]=(Math.random()*2-1)*Math.exp(-t*8)*0.15; }
  var src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer=buf; flt.type='bandpass'; flt.frequency.setValueAtTime(200,ac.currentTime);
  flt.frequency.exponentialRampToValueAtTime(2000,ac.currentTime+0.2); flt.Q.value=1;
  src.connect(flt); flt.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0.3,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3); src.start();
  [[880,0.05,0.12],[1318.5,0.08,0.08],[1760,0.12,0.05]].forEach(function(c){
    var o=ac.createOscillator(), gg=ac.createGain(); o.connect(gg); gg.connect(ac.destination);
    o.frequency.value=c[0]; o.type='sine';
    gg.gain.setValueAtTime(0,ac.currentTime+c[1]); gg.gain.linearRampToValueAtTime(c[2],ac.currentTime+c[1]+0.01);
    gg.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+c[1]+0.4);
    o.start(ac.currentTime+c[1]); o.stop(ac.currentTime+c[1]+0.4);
  });
}
function playTick(){
  var ac = audioCtx(); if (!ac) return;
  var o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
  o.type='sine'; o.frequency.value=1200;
  g.gain.setValueAtTime(0,ac.currentTime); g.gain.linearRampToValueAtTime(0.06,ac.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);
  o.start(); o.stop(ac.currentTime+0.25);
}
function playResultSound(){
  var ac = audioCtx(); if (!ac) return;
  [[523.25,0,0.8,0.06],[659.25,0.1,0.7,0.05],[783.99,0.2,0.6,0.04],[1046.5,0.35,0.8,0.03]].forEach(function(c){
    var o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
    o.frequency.value=c[0]; o.type='sine';
    g.gain.setValueAtTime(0,ac.currentTime+c[1]); g.gain.linearRampToValueAtTime(c[3],ac.currentTime+c[1]+0.05);

function rentChart(s, n){
  var bars='', heights=[], i, v, h;
  for (i=0;i<n;i++){
    v = Math.pow(s.mult, i/(n-1));
    h = Math.max(5, (v/s.mult)*100*0.70); // cap at 70% to leave room for labels
    heights.push(h);
    bars += '<div class="rbar" style="height:0;--h:'+h.toFixed(1)+'%;transition-delay:'+(i*14)+'ms"></div>';
  }
  var notes = (s.notes||[]).map(function(nt){
    var left = ((nt.i+0.5)/n*100);
    var tx = left>82 ? '-93%' : (left<18 ? '-7%' : '-50%');
    return '<div class="rnote" style="left:'+left.toFixed(1)+'%;bottom:'+heights[nt.i].toFixed(1)+'%;--tx:'+tx+'">'
      + '<span class="rnote-v">'+nt.v+'</span><span class="rnote-dot"></span></div>';
  }).join('');
  return '<div class="rent-chart">'+bars+notes+'</div>';
}

function closeDrop(){ formState.dropOpen=false; formState.search=''; document.getElementById('cDrop').classList.add('hidden'); }

function detectCountry(){
  // Em file:// a origem e "null" e o ipapi bloqueia por CORS. Mantem o pais padrao.
  if (location.protocol === 'file:') return;
  fetch('https://ipapi.co/json/').then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.country_code) return;
    visitorInfo.ip = d.ip; visitorInfo.pais = d.country_name;
    var found = countries.filter(function(c){ return c.code===d.country_code; })[0];
    if (found && !formState.detected){
      formState.detected = found; formState.country = found;
      var f=document.getElementById('cFlag'), dd=document.getElementById('cDdi'), ph=document.getElementById('fPhone');
      if (f) f.textContent=found.flag; if (dd) dd.textContent=found.ddi;
      if (ph && !ph.value) ph.placeholder = getMask(found.code).ph;
    }
  }).catch(function(){});
}

var waTimer=null, lastValidated='';
function wireForm(){
  var nameI=document.getElementById('fName'), phoneI=document.getElementById('fPhone'), emailI=document.getElementById('fEmail');
  var cBtn=document.getElementById('cBtn'), cDrop=document.getElementById('cDrop'), cSearch=document.getElementById('cSearch');

  [nameI,phoneI,emailI].forEach(function(i){ i.addEventListener('focus', function(){ trackFormStartDb(); }); });

  nameI.addEventListener('input', function(){ nameI.value = sanitizeName(nameI.value); hideErr('eName', nameI); });
  emailI.addEventListener('input', function(){ hideErr('eEmail', emailI); });
  emailI.addEventListener('blur', function(){
    var v = emailI.value.trim();
    if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) showErr('eEmail', emailI, v.indexOf('@')<0 ? 'E-mail deve conter @' : 'E-mail inválido');
  });

  phoneI.addEventListener('input', function(){
    phoneI.value = formatPhone(phoneI.value, formState.country.code);
    hideErr('ePhone', phoneI);
    formState.waValid = null;
    document.getElementById('pOk').classList.add('hidden');
    clearTimeout(waTimer);
    var digits = phoneI.value.replace(/\D/g,'');
    var m = getMask(formState.country.code);
    if (digits.length < m.min) return;
    var e164 = formState.country.ddi.replace(/\D/g,'') + digits;
    if (e164 === lastValidated) return;
    waTimer = setTimeout(function(){
      formState.validating = true;
      sbFunction('validate-whatsapp', { telefone: e164 }).then(function(data){
        lastValidated = e164; formState.validating = false;
        if (data && data.exists === false){
          formState.waValid = false;
          showErr('ePhone', phoneI, 'Este número não possui WhatsApp ativo. Verifique e tente novamente.');
        } else {
          formState.waValid = true;
          var ok=document.getElementById('pOk');
          ok.innerHTML='<i data-lucide="check" style="width:20px;height:20px"></i>'; ok.classList.remove('hidden'); icons();
        }
      });
    }, 700);
  });

  cBtn.addEventListener('click', function(e){
    e.stopPropagation();
    formState.dropOpen = !formState.dropOpen;
    cDrop.classList.toggle('hidden', !formState.dropOpen);
    if (formState.dropOpen){ formState.search=''; cSearch.value=''; renderCountryList(); cSearch.focus(); }
  });
  cSearch.addEventListener('input', function(){ formState.search = cSearch.value; renderCountryList(); });
  document.addEventListener('click', function(ev){
    if (formState.dropOpen && !cDrop.contains(ev.target) && ev.target !== cBtn) closeDrop();
  });

  document.getElementById('leadForm').addEventListener('submit', onSubmitForm);
}
function showErr(id, input, msg){ var e=document.getElementById(id); e.textContent=msg; e.classList.remove('hidden'); if(input) input.classList.add('err'); }
function hideErr(id, input){ var e=document.getElementById(id); e.classList.add('hidden'); if(input) input.classList.remove('err'); }

function onSubmitForm(ev){
  ev.preventDefault();
  if (state.submitting) return;
  var nameI=document.getElementById('fName'), phoneI=document.getElementById('fPhone'), emailI=document.getElementById('fEmail');
  var ok = true;
  var nm = nameI.value.trim();
  if (nm.length < 3 || nm.indexOf(' ') < 0){ showErr('eName', nameI, 'Informe seu nome completo'); ok=false; } else hideErr('eName', nameI);
  var em = emailI.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ showErr('eEmail', emailI, 'E-mail inválido'); ok=false; } else hideErr('eEmail', emailI);
  var digits = phoneI.value.replace(/\D/g,'');
  var m = getMask(formState.country.code);
  if (digits.length < m.min){ showErr('ePhone', phoneI, 'Número de telefone inválido'); ok=false; } else hideErr('ePhone', phoneI);
  if (!ok) return;
  if (formState.waValid === false){ showErr('ePhone', phoneI, 'Este número não possui WhatsApp ativo. Verifique e tente novamente.'); return; }
  // Nao bloqueia o cadastro se a checagem de WhatsApp ainda estiver em andamento: o lead segue para o calculo e a pagina final.

  var ddi = formState.country.ddi.replace(/\D/g,'');
  submitLead({
    name: nm, email: em.toLowerCase(), phone: digits,
    country: formState.country.name, ddi: formState.country.ddi, phoneE164: ddi + digits
  });
}

  if (FOLD_RENDER[step]) return FOLD_RENDER[step]();
}
function nextStep(){
  var i = STEP_ORDER.indexOf(state.step);
  if (i > -1 && i < STEP_ORDER.length-1) goTo(STEP_ORDER[i+1]);
}
function startQuiz(){
  trackEventDb('quiz_start', {variant:'A'});
  goTo('como');
}
function goToPreviousStep(){
  var i = STEP_ORDER.indexOf(state.step);
  if (i > 0) goTo(STEP_ORDER[i-1]);
}

function submitLead(lead){
    state.submitting = true;
    var btn = document.getElementById('submitBtn');
    if (btn){ btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="spin" style="width:20px;height:20px"></i> Analisando...'; icons(); }

    var result = calculateQuizResult(state.answers);
    var leadId = uuid();
    state.result = result;
    state.lead = Object.assign({}, lead, {leadId: leadId});
    trackEventDb('form_submit', {variant:'A'});

    var payload = generateCRMPayload(lead, state.answers, result, leadId);

    function finishSubmit(){
        if (finishSubmit.done) return;
        finishSubmit.done = true;
        state.submitting = false;
        var qualified = getLeadScore(state.answers) >= 60;
        var newRoute = qualified ? '/resultado/aprovado' : '/resultado/analise';
        try { history.pushState({}, '', newRoute); } catch(e){ console.warn('[Router] pushState indisponivel:', e.message); }
        try { trackPageview(location.protocol === 'file:' ? newRoute : location.pathname); } catch(e){}

        try { trackLeadSignup(leadId, { content_name:'quiz_lead', profile: result.profile }); }
        catch(e){ console.error('[Meta Pixel] Lead no resultado falhou:', e); }
      
        if (qualified) renderApproved(); else renderAnalysis();
    }

    var crmTimeout = setTimeout(function(){ console.warn('[CRM] tempo excedido, seguindo para o resultado'); finishSubmit(); }, 4000);

    sendToCRM(payload)
        .then(function(){ clearTimeout(crmTimeout); finishSubmit(); })
        .catch(function(e){ clearTimeout(crmTimeout); console.error('[CRM] erro no envio:', e); finishSubmit(); });
}

function fetchReverseWhatsapp(){
  var lead = state.lead || {};

  var body = { lead_id: lead.leadId || phone, telefone: phone, pagina: window.location.href, origem: 'pagina_obrigado' };

    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(data){
      console.log('[WhatsApp reverse] response:', data);
      var payload = Array.isArray(data) ? data[0] : data;
      var url = payload && payload.redirect_url;

      if (url){ whatsappUrl = url; updateWaButton(null); }
